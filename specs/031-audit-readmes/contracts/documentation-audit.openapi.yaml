openapi: 3.1.0
info:
  title: Documentation Audit Interface
  version: 1.0.0
  description: |
    Contract for planning and validating README documentation audit operations.
    This API describes expected request/response behavior for audit workflows
    and acceptance validation.
servers:
  - url: https://docs-audit.local
paths:
  /audits:
    post:
      summary: Start a documentation audit run
      operationId: startAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRunRequest'
      responses:
        '201':
          description: Audit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRun'
  /audits/{auditId}/claims:
    post:
      summary: Register or update claim verification results
      operationId: upsertClaimVerification
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimVerificationRequest'
      responses:
        '200':
          description: Claim verification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationClaim'
  /audits/{auditId}/badges/validate:
    post:
      summary: Validate required README badges and links
      operationId: validateBadges
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetPath, badges]
              properties:
                assetPath:
                  type: string
                badges:
                  type: array
                  items:
                    $ref: '#/components/schemas/BadgeDefinition'
      responses:
        '200':
          description: Badge validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeValidationResult'
  /audits/{auditId}/framework-support:
    put:
      summary: Set framework support matrix entries
      operationId: setFrameworkSupport
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetPath, entries]
              properties:
                assetPath:
                  type: string
                entries:
                  type: array
                  minItems: 4
                  items:
                    $ref: '#/components/schemas/FrameworkSupportEntry'
      responses:
        '200':
          description: Framework support updated
          content:
            application/json:
              schema:
                type: object
                required: [requiredFrameworksPresent, entryCount]
                properties:
                  requiredFrameworksPresent:
                    type: boolean
                  entryCount:
                    type: integer
  /audits/{auditId}/complete:
    post:
      summary: Complete audit after all required findings are resolved
      operationId: completeAudit
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: Audit completion summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCompletionSummary'
        '409':
          description: Unresolved major/critical findings remain

components:
  parameters:
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        type: string

  schemas:
    AuditRunRequest:
      type: object
      required: [featureId, assetPaths]
      properties:
        featureId:
          type: string
          example: 031-audit-readmes
        assetPaths:
          type: array
          minItems: 1
          items:
            type: string

    AuditRun:
      type: object
      required: [auditId, status, startedAt, assetCount]
      properties:
        auditId:
          type: string
        status:
          type: string
          enum: [not-reviewed, in-review, verified, needs-update]
        startedAt:
          type: string
          format: date-time
        assetCount:
          type: integer

    DocumentationClaim:
      type: object
      required: [claimId, assetPath, claimText, claimType, verificationState, evidenceRef]
      properties:
        claimId:
          type: string
        assetPath:
          type: string
        claimText:
          type: string
        claimType:
          type: string
          enum: [capability, installation, workflow, status, link-reference]
        verificationState:
          type: string
          enum: [verified, outdated, missing-context, cannot-verify]
        evidenceRef:
          type: string

    ClaimVerificationRequest:
      type: object
      required: [claimId, assetPath, claimText, claimType, verificationState, evidenceRef]
      properties:
        claimId:
          type: string
        assetPath:
          type: string
        claimText:
          type: string
        claimType:
          type: string
          enum: [capability, installation, workflow, status, link-reference]
        verificationState:
          type: string
          enum: [verified, outdated, missing-context, cannot-verify]
        evidenceRef:
          type: string

    BadgeDefinition:
      type: object
      required: [badgeType, displayLabel, imageUrl, targetUrl, applicable]
      properties:
        badgeType:
          type: string
          enum: [npm, ci, license, optional]
        displayLabel:
          type: string
        imageUrl:
          type: string
          format: uri
        targetUrl:
          type: string
          format: uri
        applicable:
          type: boolean

    BadgeValidationResult:
      type: object
      required: [assetPath, hasNpmBadge, hasCiBadge, hasLicenseBadge, allTargetsValid]
      properties:
        assetPath:
          type: string
        hasNpmBadge:
          type: boolean
        hasCiBadge:
          type: boolean
        hasLicenseBadge:
          type: boolean
        allTargetsValid:
          type: boolean

    FrameworkSupportEntry:
      type: object
      required: [frameworkName, supportLevel, scopeSummary, evidenceOrNote]
      properties:
        frameworkName:
          type: string
        supportLevel:
          type: string
          enum: [Native, Supported with modifications, Experimental, Not supported]
        scopeSummary:
          type: string
        caveats:
          type: string
        evidenceOrNote:
          type: string

    AuditCompletionSummary:
      type: object
      required:
        [
          auditId,
          status,
          totalClaims,
          unresolvedCritical,
          unresolvedMajor,
          unresolvedMinor,
          completedAt,
        ]
      properties:
        auditId:
          type: string
        status:
          type: string
          enum: [verified]
        totalClaims:
          type: integer
        unresolvedCritical:
          type: integer
        unresolvedMajor:
          type: integer
        unresolvedMinor:
          type: integer
        completedAt:
          type: string
          format: date-time
