openapi: 3.0.3
info:
  title: Remove Command Flow
  version: 1.0.0
  description: Contract for interactive worktree removal flow.
servers:
  - url: https://localhost
paths:
  /worktrees:
    get:
      summary: List selectable worktrees
      responses:
        "200":
          description: Worktree list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worktree"
  /worktrees/selection:
    post:
      summary: Submit selected worktrees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionRequest"
      responses:
        "200":
          description: Selection accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionResponse"
        "400":
          description: No selection made
  /worktrees/confirm:
    post:
      summary: Confirm removal of selected worktrees or branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationRequest"
      responses:
        "200":
          description: Removal completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationResponse"
        "404":
          description: One or more branches invalid
        "409":
          description: Confirmation declined
  /worktrees/cancel:
    post:
      summary: Cancel the selection or confirmation flow
      responses:
        "200":
          description: Flow cancelled
components:
  schemas:
    Worktree:
      type: object
      required:
        - id
        - path
        - branch
      properties:
        id:
          type: string
        path:
          type: string
        branch:
          type: string
        isLocked:
          type: boolean
        isDirty:
          type: boolean
    SelectionRequest:
      type: object
      required:
        - worktreeIds
      properties:
        worktreeIds:
          type: array
          items:
            type: string
    SelectionResponse:
      type: object
      required:
        - nextStep
      properties:
        nextStep:
          type: string
          enum:
            - confirm-removal
    ConfirmationRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: boolean
        worktreeIds:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            type: string
    ConfirmationResponse:
      type: object
      required:
        - removedCount
      properties:
        removedCount:
          type: integer
