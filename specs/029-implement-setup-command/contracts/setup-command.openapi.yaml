openapi: 3.0.3
info:
  title: Workspace Setup Command Contract
  version: 1.0.0
  description: Conceptual contract for executing workspace setup tasks.
paths:
  /setup:
    post:
      summary: Execute setup tasks for workspace repositories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup run completed with no failures or timeouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRunSummary"
        "207":
          description: Setup run completed with mixed outcomes (some failed or timed-out)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRunSummary"
        "400":
          description: Invalid setup request
components:
  schemas:
    SetupRequest:
      type: object
      properties:
        only:
          type: array
          items:
            type: string
          description: Optional repository names to include in setup execution.
        verbose:
          type: boolean
          description: Whether to display full setup output for each repository.
      additionalProperties: false
    RepositorySetupTarget:
      type: object
      properties:
        repositoryName:
          type: string
        scopeType:
          type: string
          enum: [main, sub]
        hasSetupTask:
          type: boolean
        selected:
          type: boolean
      required: [repositoryName, scopeType, hasSetupTask, selected]
    SetupTaskExecution:
      type: object
      properties:
        repositoryName:
          type: string
        status:
          type: string
          enum: [success, skipped, failed, timed-out]
        durationMs:
          type: integer
          minimum: 0
        detail:
          type: string
      required: [repositoryName, status, durationMs]
    SetupRunSummary:
      type: object
      properties:
        overallStatus:
          type: string
          enum: [success, partial-failure, failure]
        totalRepositoriesEvaluated:
          type: integer
          minimum: 0
        executedCount:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        timedOutCount:
          type: integer
          minimum: 0
        targets:
          type: array
          items:
            $ref: "#/components/schemas/RepositorySetupTarget"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/SetupTaskExecution"
      required:
        - overallStatus
        - totalRepositoriesEvaluated
        - executedCount
        - successCount
        - skippedCount
        - failedCount
        - timedOutCount
        - targets
        - executions
