openapi: 3.0.3
info:
  title: CLI Launcher Contract
  version: 1.0.0
  description: |
    Conceptual contract for CLI startup behavior. This models launcher inputs and
    outcomes for planning and testing, not a network API.
servers:
  - url: https://localhost
paths:
  /cli/launch:
    post:
      summary: Launch the CLI with a detected shell context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shell
                - installScope
                - command
              properties:
                shell:
                  type: string
                  enum: [powershell, git-bash, other]
                installScope:
                  type: string
                  enum: [global, local]
                command:
                  type: string
                osVersion:
                  type: string
      responses:
        "200":
          description: CLI started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [started]
                  message:
                    type: string
        "400":
          description: Unsupported context or invalid inputs
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - error
                properties:
                  status:
                    type: string
                    enum: [failed]
                  error:
                    type: string
        "500":
          description: Startup failure with guidance
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - error
                  - guidance
                properties:
                  status:
                    type: string
                    enum: [failed]
                  error:
                    type: string
                  guidance:
                    type: string
  /cli/diagnostics:
    post:
      summary: Return diagnostics for troubleshooting startup failures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shell
              properties:
                shell:
                  type: string
                  enum: [powershell, git-bash, other]
                osVersion:
                  type: string
      responses:
        "200":
          description: Diagnostics returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - diagnostics
                properties:
                  status:
                    type: string
                    enum: [ok]
                  diagnostics:
                    type: string
