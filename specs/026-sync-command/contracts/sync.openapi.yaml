openapi: 3.0.3
info:
  title: Sync Command Contract
  version: 1.0.0
paths:
  /sync:
    post:
      summary: Align repositories to parent branch
      description: Syncs managed repositories to the parent branch, optionally filtered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                only:
                  type: array
                  items:
                    type: string
                  description: Optional list of repository names to sync.
                verbose:
                  type: boolean
                  description: Whether to return verbose output details.
              additionalProperties: false
      responses:
        "200":
          description: Sync completed with summary results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  successCount:
                    type: integer
                  failureCount:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        repositoryName:
                          type: string
                        targetBranch:
                          type: string
                        status:
                          type: string
                          enum: [success, failure, timeout]
                        durationMs:
                          type: integer
                        createdBranch:
                          type: boolean
                        errorMessage:
                          type: string
                      required:
                        - repositoryName
                        - targetBranch
                        - status
                        - durationMs
                        - createdBranch
                required:
                  - successCount
                  - failureCount
                  - results
        "400":
          description: Invalid configuration or request.
        "500":
          description: Unexpected failure during sync.
