openapi: 3.1.0
info:
  title: Arashi Skills Integration Contract
  version: 0.1.0
  description: >-
    Planning contract for skill installation, validation, workflow execution,
    and optional publication lifecycle.
  x-parity-status:
    checkedAt: 2026-02-10
    installCommand: npm install -g arashi
    verifyCommand: arashi --version
    workflowReferences:
      - skills/arashi/references/workflows.md
      - skills/arashi/references/session-shortcuts.md
    result: aligned
servers:
  - url: https://skills.sh
    description: Skills platform endpoint
tags:
  - name: Installation
  - name: Validation
  - name: Workflows
  - name: Publication
paths:
  /skills/arashi/install:
    post:
      tags: [Installation]
      summary: Install Arashi CLI required by the skill
      operationId: installArashiSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '201':
          description: Arashi CLI installed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
        '409':
          description: Conflicting existing setup
        '422':
          description: Missing prerequisites
  /skills/arashi/verify:
    post:
      tags: [Validation]
      summary: Verify Arashi CLI and workflow readiness
      operationId: verifyArashiSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '422':
          description: Verification failed
  /skills/arashi/workflows/{workflowId}/run:
    post:
      tags: [Workflows]
      summary: Execute a documented workflow example command sequence
      operationId: runWorkflow
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
      responses:
        '202':
          description: Workflow execution accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '404':
          description: Unknown workflow
        '422':
          description: Workflow prerequisites not met
  /skills/arashi/publish:
    post:
      tags: [Publication]
      summary: Publish skill to discoverable registry when supported
      operationId: publishSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Publication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '409':
          description: Publication unavailable for account/policy
        '422':
          description: Validation prerequisites incomplete
components:
  schemas:
    InstallRequest:
      type: object
      required: [sourceRepository, targetEnvironment, installCommand]
      properties:
        sourceRepository:
          type: string
          example: https://github.com/corwinm/arashi.git
        targetEnvironment:
          type: string
          enum: [macos, linux, windows]
        installCommand:
          type: string
          description: Canonical Arashi CLI installation command documented by the skill.
          enum: [npm install -g arashi]
        verifyCommand:
          type: string
          description: Optional immediate verification command run after install.
          example: arashi --version
        existingSetupHandling:
          type: string
          enum: [fail, preserve, replace]
    InstallResponse:
      type: object
      required: [installationId, status, nextStep]
      properties:
        installationId:
          type: string
        status:
          type: string
          enum: [installed]
        nextStep:
          type: string
    VerifyRequest:
      type: object
      required: [installationId, verifyCommand]
      properties:
        installationId:
          type: string
        verifyCommand:
          type: string
          description: Canonical Arashi CLI verification command.
          enum: [arashi --version]
        includePreflightCheck:
          type: boolean
          default: true
        includeInstallCheck:
          type: boolean
          default: true
        includeWorkflowCheck:
          type: boolean
          default: true
    VerifyResponse:
      type: object
      required: [verificationId, status, checks]
      properties:
        verificationId:
          type: string
        status:
          type: string
          enum: [passed, failed]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCheck'
    ValidationCheck:
      type: object
      required: [name, result]
      properties:
        name:
          type: string
        result:
          type: string
          enum: [passed, failed]
        message:
          type: string
    WorkflowRunRequest:
      type: object
      required: [installationId, workflowCommand]
      properties:
        installationId:
          type: string
        workflowCommand:
          type: string
          description: Human-runnable command sequence entrypoint for the selected workflow.
          example: Follow skills/arashi/references/workflows.md Beginner Workflow section
        parameters:
          type: object
          additionalProperties: true
    WorkflowRunResponse:
      type: object
      required: [runId, status]
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [accepted, completed, failed]
        outputSummary:
          type: string
    PublishRequest:
      type: object
      required: [releaseReference, publicationMode]
      properties:
        releaseReference:
          type: string
        publicationMode:
          type: string
          description: Whether registry listing is available for the current account policy.
          enum: [repository_only, registry_listing]
        publicationCommand:
          type: string
          description: Optional publication command when listing is supported.
          example: git tag -a skill-arashi-v0.1.0 -m "arashi skill package v0.1.0" && git push origin skill-arashi-v0.1.0
        visibility:
          type: string
          enum: [public, restricted]
    PublishResponse:
      type: object
      required: [publicationStatus]
      properties:
        publicationStatus:
          type: string
          enum: [published, not_applicable, failed]
        discoveryReference:
          type: string
