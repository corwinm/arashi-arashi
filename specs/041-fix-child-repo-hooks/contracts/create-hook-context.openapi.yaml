openapi: 3.0.3
info:
  title: Arashi Create Hook Context Contract
  version: 1.0.0
  description: >-
    Contract for create command behavior that guarantees consistent post-create
    hook execution and reporting when invoked from workspace root or child repositories.
paths:
  /create/resolve-context:
    post:
      summary: Resolve create invocation context
      description: Resolves workspace and execution context from command invocation path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveContextRequest'
      responses:
        '200':
          description: Invocation context resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveContextResponse'
        '422':
          description: Invocation path is outside a managed workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create/execute:
    post:
      summary: Execute coordinated create with hooks
      description: Creates worktrees and evaluates post-create hooks for selected repositories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecuteRequest'
      responses:
        '200':
          description: Create command completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExecuteResponse'
        '409':
          description: Create conflict or hook failure caused operation failure and rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExecuteResponse'
        '422':
          description: Validation failed before create execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ResolveContextRequest:
      type: object
      required:
        - invocationPath
        - branchName
      properties:
        invocationPath:
          type: string
          description: Absolute path where command is started.
        branchName:
          type: string
          description: Requested branch/worktree name.

    ResolveContextResponse:
      type: object
      required:
        - workspaceRoot
        - executionPath
        - repositoryContextType
      properties:
        workspaceRoot:
          type: string
        executionPath:
          type: string
        repositoryContextType:
          type: string
          enum: [workspace_root, child_repository, nested_child_path]
        guidance:
          type: string
          description: Actionable message for partial or warning conditions.

    CreateExecuteRequest:
      type: object
      required:
        - branchName
        - workspaceRoot
      properties:
        branchName:
          type: string
        workspaceRoot:
          type: string
        selectedRepositories:
          type: array
          items:
            type: string
        hooksEnabled:
          type: boolean
          default: true
        dryRun:
          type: boolean
          default: false

    CreateExecuteResponse:
      type: object
      required:
        - overallOutcome
        - rollbackApplied
        - repositoryResults
      properties:
        overallOutcome:
          type: string
          enum: [success, failure]
        rollbackApplied:
          type: boolean
        repositoryResults:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryResult'
        nextSteps:
          type: array
          items:
            type: string

    RepositoryResult:
      type: object
      required:
        - repositoryId
        - hookName
        - hookStatus
        - reasonCode
        - message
      properties:
        repositoryId:
          type: string
          description: Repository identifier for the evaluated hook.
        hookName:
          type: string
          description: Fully qualified lifecycle hook name (for example post-create.repo-a).
        hookStatus:
          type: string
          enum: [success, failure, skipped]
        reasonCode:
          type: string
          enum: [none, not_found, disabled, timeout, exit_non_zero, not_applicable]
        message:
          type: string
        durationMs:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - guidance
      properties:
        code:
          type: string
        message:
          type: string
        guidance:
          type: string
