name: Cross-repository command contracts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVENT_NAME: ${{ github.event_name }}
  EVENT_REPOSITORY: ${{ github.repository }}
  EVENT_REF: ${{ github.ref }}
  EVENT_SHA: ${{ github.sha }}
  WORKFLOW_REF: ${{ github.workflow_ref }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  contracts:
    name: Advisory integration
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable revisions
        id: revisions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/;
            const upstream = "corwinm/arashi-arashi";
            const expectedRef = `${upstream}/.github/workflows/cross-repo-command-contracts.yml@refs/heads/main`;
            if (process.env.EVENT_NAME !== "workflow_dispatch" ||
                process.env.EVENT_REPOSITORY !== upstream ||
                process.env.EVENT_REF !== "refs/heads/main") {
              throw new Error("Only upstream main workflow_dispatch is supported");
            }
            if (process.env.WORKFLOW_REF !== expectedRef ||
                !shaPattern.test(process.env.WORKFLOW_SHA ?? "") ||
                !shaPattern.test(process.env.EVENT_SHA ?? "") ||
                process.env.WORKFLOW_SHA !== process.env.EVENT_SHA) {
              throw new Error("Executing workflow ref/SHA must match the main dispatch SHA");
            }
            const repositories = ["arashi-arashi", "arashi", "arashi-docs", "arashi-skills", "arashi-vscode", "arashi-presentation"];
            const revisions = [];
            for (const repo of repositories) {
              const source = `corwinm/${repo}`;
              const identity = await github.rest.repos.get({ owner: "corwinm", repo });
              if (identity.data.full_name !== source || identity.data.fork !== false) {
                throw new Error(`Unexpected upstream identity for ${source}`);
              }
              let sha = process.env.EVENT_SHA;
              if (repo !== "arashi-arashi") {
                const branch = await github.rest.repos.getBranch({ owner: "corwinm", repo, branch: "main" });
                if (branch.data.name !== "main") throw new Error(`Wrong main ref for ${source}`);
                sha = branch.data.commit.sha;
              }
              if (!shaPattern.test(sha ?? "")) throw new Error(`Invalid full lowercase SHA for ${source}`);
              revisions.push({ repo, source, sha });
            }
            // Publish only a complete snapshot; never re-resolve after checkout starts.
            for (const { repo, source, sha } of revisions) {
              const prefix = repo.replaceAll("-", "_");
              core.setOutput(`${prefix}_source`, source);
              core.setOutput(`${prefix}_sha`, sha);
            }

      - name: Check out meta-repository
        id: check_out_meta_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_arashi_source }}
          ref: ${{ steps.revisions.outputs.arashi_arashi_sha }}
          path: meta
          persist-credentials: false
      - name: Check out Arashi CLI
        id: check_out_arashi_cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_source }}
          ref: ${{ steps.revisions.outputs.arashi_sha }}
          path: meta/repos/arashi
          persist-credentials: false
      - name: Check out Arashi docs
        id: check_out_arashi_docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_docs_source }}
          ref: ${{ steps.revisions.outputs.arashi_docs_sha }}
          path: meta/repos/arashi-docs
          persist-credentials: false
      - name: Check out Arashi skills
        id: check_out_arashi_skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_skills_source }}
          ref: ${{ steps.revisions.outputs.arashi_skills_sha }}
          path: meta/repos/arashi-skills
          persist-credentials: false
      - name: Check out Arashi VS Code
        id: check_out_arashi_vs_code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_vscode_source }}
          ref: ${{ steps.revisions.outputs.arashi_vscode_sha }}
          path: meta/repos/arashi-vscode
          persist-credentials: false
      - name: Check out Arashi presentation
        id: check_out_arashi_presentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.revisions.outputs.arashi_presentation_source }}
          ref: ${{ steps.revisions.outputs.arashi_presentation_sha }}
          path: meta/repos/arashi-presentation
          persist-credentials: false

      - name: Write revision manifest
        id: write_revision_manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARASHI_ARASHI_SOURCE: ${{ steps.revisions.outputs.arashi_arashi_source }}
          ARASHI_ARASHI_SHA: ${{ steps.revisions.outputs.arashi_arashi_sha }}
          ARASHI_SOURCE: ${{ steps.revisions.outputs.arashi_source }}
          ARASHI_SHA: ${{ steps.revisions.outputs.arashi_sha }}
          ARASHI_DOCS_SOURCE: ${{ steps.revisions.outputs.arashi_docs_source }}
          ARASHI_DOCS_SHA: ${{ steps.revisions.outputs.arashi_docs_sha }}
          ARASHI_SKILLS_SOURCE: ${{ steps.revisions.outputs.arashi_skills_source }}
          ARASHI_SKILLS_SHA: ${{ steps.revisions.outputs.arashi_skills_sha }}
          ARASHI_VSCODE_SOURCE: ${{ steps.revisions.outputs.arashi_vscode_source }}
          ARASHI_VSCODE_SHA: ${{ steps.revisions.outputs.arashi_vscode_sha }}
          ARASHI_PRESENTATION_SOURCE: ${{ steps.revisions.outputs.arashi_presentation_source }}
          ARASHI_PRESENTATION_SHA: ${{ steps.revisions.outputs.arashi_presentation_sha }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { appendFileSync, writeFileSync } = require("node:fs");
            const shaPattern = /^[0-9a-f]{40}$/;
            const definitions = [
              ["arashi-arashi", "ARASHI_ARASHI", "meta"],
              ["arashi", "ARASHI", "meta/repos/arashi"],
              ["arashi-docs", "ARASHI_DOCS", "meta/repos/arashi-docs"],
              ["arashi-skills", "ARASHI_SKILLS", "meta/repos/arashi-skills"],
              ["arashi-vscode", "ARASHI_VSCODE", "meta/repos/arashi-vscode"],
              ["arashi-presentation", "ARASHI_PRESENTATION", "meta/repos/arashi-presentation"],
            ];
            const canonical = ["arashi-arashi", "arashi", "arashi-docs", "arashi-skills", "arashi-vscode", "arashi-presentation"];
            if (definitions.length !== canonical.length || definitions.some(([name], index) => name !== canonical[index])) {
              throw new Error("Manifest repositories must be complete, unique and in canonical order");
            }
            const repositories = definitions.map(([logicalRepository, prefix, path]) => {
              const sourceRepository = process.env[`${prefix}_SOURCE`];
              const sha = process.env[`${prefix}_SHA`];
              if (sourceRepository !== `corwinm/${logicalRepository}` || !shaPattern.test(sha ?? "")) {
                core.setFailed(`Incomplete revision for ${logicalRepository}`);
                throw new Error(`Incomplete revision for ${logicalRepository}`);
              }
              const head = execFileSync("git", ["-C", path, "rev-parse", "HEAD"], {
                encoding: "utf8",
              }).trim();
              if (head !== sha) {
                core.setFailed(`${logicalRepository} checkout is ${head}, expected ${sha}`);
                throw new Error(`${logicalRepository} checkout mismatch`);
              }
              return { logicalRepository, sourceRepository, sha };
            });
            const trigger = repositories[0];
            const event = {
              name: process.env.EVENT_NAME,
              repository: process.env.EVENT_REPOSITORY,
              ref: process.env.EVENT_REF,
              sha: process.env.EVENT_SHA,
            };
            const coordinator = {
              repository: "corwinm/arashi-arashi",
              ref: process.env.WORKFLOW_REF,
              sha: process.env.WORKFLOW_SHA,
            };
            if (event.name !== "workflow_dispatch" || event.ref !== "refs/heads/main" ||
                event.repository !== trigger.sourceRepository || event.sha !== trigger.sha ||
                coordinator.sha !== trigger.sha ||
                coordinator.ref !== `${coordinator.repository}/.github/workflows/cross-repo-command-contracts.yml@refs/heads/main`) {
              throw new Error("Invalid manifest dispatch/coordinator provenance");
            }
            const manifest = `${JSON.stringify(
              { schemaVersion: 2, event, coordinator, trigger, repositories },
              null,
              2,
            )}\n`;
            writeFileSync("meta/cross-repo-revisions.json", manifest);
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Cross-repository revisions\n\n\`\`\`json\n${manifest}\`\`\`\n`,
            );

      - name: Upload revision manifest
        id: revision_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-repo-revisions
          path: meta/cross-repo-revisions.json
          if-no-files-found: error
          retention-days: 30

      - name: Report revision artifact digest
        id: report_revision_artifact_digest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_DIGEST: ${{ steps.revision_artifact.outputs.artifact-digest }}
        with:
          script: |
            if (!process.env.ARTIFACT_DIGEST?.match(/^[0-9a-f]{64}$/)) {
              core.setFailed("Revision artifact did not return a SHA-256 digest");
              throw new Error("Missing or malformed revision artifact digest");
            }
            const artifactArchiveDigest = process.env.ARTIFACT_DIGEST;
            await core.summary
              .addRaw(`**Artifact archive digest:** \`sha256:${artifactArchiveDigest}\``)
              .write();

      - uses: pnpm/setup@v3
        id: setup_toolchain
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          cache-dependency-path: meta/pnpm-lock.yaml
          package-json-file: meta/package.json
          install: false
      - name: Install pinned checker toolchain
        id: install_pinned_checker_toolchain
        working-directory: meta
        run: pnpm install --frozen-lockfile
      - name: Install CLI generation toolchain
        id: install_cli_generation_toolchain
        working-directory: meta
        run: pnpm --dir repos/arashi install --frozen-lockfile
      - name: Generate CLI configuration schema
        id: generate_cli_configuration_schema
        working-directory: meta
        run: pnpm --dir repos/arashi schema:publish
      - name: Check CLI configuration schema freshness
        id: check_cli_configuration_schema_freshness
        working-directory: meta
        run: pnpm --dir repos/arashi schema:check
      - name: Generate CLI command contract
        id: generate_cli_command_contract
        working-directory: meta
        run: pnpm --dir repos/arashi contract:generate
      - name: Check CLI command contract freshness
        id: check_cli_command_contract_freshness
        working-directory: meta
        run: pnpm --dir repos/arashi contract:check
      - name: Generate native shell-completion artifacts
        id: generate_native_shell_completion_artifacts
        working-directory: meta
        run: pnpm --dir repos/arashi completion:generate
      - name: Check native shell-completion freshness
        id: check_native_shell_completion_freshness
        working-directory: meta
        run: pnpm --dir repos/arashi completion:check
      - name: Reject generated CLI contract diffs
        id: reject_generated_cli_contract_diffs
        working-directory: meta
        run: git -C repos/arashi diff --exit-code -- schema/config.schema.json contracts/cli-commands.json contracts/executable-distribution.json src/generated/completions.ts
      - name: Install documentation generation toolchain
        id: install_documentation_generation_toolchain
        working-directory: meta
        run: pnpm --dir repos/arashi-docs install --frozen-lockfile
      - name: Check documentation semantics
        id: check_documentation_semantics
        working-directory: meta
        run: pnpm --dir repos/arashi-docs validate:semantic-docs
      - name: Check authored skill guidance
        id: check_authored_skill_guidance
        working-directory: meta
        run: node repos/arashi-skills/scripts/validate-guidance.mjs
      - name: Create canonical skill release archive
        id: create_canonical_skill_release_archive
        working-directory: meta
        run: node repos/arashi-skills/scripts/create-release-archive.mjs --root repos/arashi-skills --output arashi-skill-package.tar.gz
      - name: Verify canonical skill release archive
        id: verify_canonical_skill_release_archive
        working-directory: meta
        run: node repos/arashi-skills/scripts/create-release-archive.mjs --verify arashi-skill-package.tar.gz
      - name: Extract canonical skill release archive
        id: extract_canonical_skill_release_archive
        working-directory: meta
        run: |
          mkdir package-check
          tar -xzf arashi-skill-package.tar.gz -C package-check
      - name: Check packaged skill guidance
        id: check_packaged_skill_guidance
        working-directory: meta
        run: node repos/arashi-skills/scripts/validate-guidance.mjs --skill-root package-check/skills/arashi
      - name: Test checker
        id: test_checker
        working-directory: meta
        run: pnpm test:integration
      - name: Type-check checker
        id: type_check_checker
        working-directory: meta
        run: pnpm typecheck

      - name: Check cross-repository contracts
        id: check_cross_repository_contracts
        working-directory: meta
        run: pnpm contracts:check:ci

      - name: Report advisory outcome
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const required = ["revisions", "write_revision_manifest", "revision_artifact", "report_revision_artifact_digest", "check_documentation_semantics", "check_authored_skill_guidance", "check_packaged_skill_guidance", "test_checker", "check_cross_repository_contracts"];
            const failed = [...new Set([...Object.keys(steps), ...required])]
              .filter((id) => steps[id]?.outcome !== "success");
            const evidence = steps.revision_artifact?.outcome === "success" && steps.report_revision_artifact_digest?.outcome === "success";
            const complete = process.env.JOB_STATUS === "success" && failed.length === 0;
            if (!complete) core.setFailed("Advisory assessment incomplete; see unsuccessful phases and original diagnostics");
            const outcome = complete
              ? "Assessment passed for the recorded snapshot only."
              : `Inability to validate: unsuccessful phases ${failed.join(", ") || "runner/cancellation"}. A nonzero exit alone is not proof of semantic drift; inspect the named step diagnostics for confirmed drift (both may be present).`;
            await core.summary
              .addHeading("Advisory integration outcome")
              .addRaw(`${outcome}\n\n${evidence ? "Revision evidence was published before validation and remains available." : "Revision evidence gate did not complete; do not claim a complete assessment."}\n\nThis assessment is not a merge gate and performs no automatic follow-up actions.`)
              .write();
