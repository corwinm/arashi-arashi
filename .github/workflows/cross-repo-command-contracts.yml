name: Cross-repository command contracts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/cross-repo-command-contracts.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out meta-repository
        uses: actions/checkout@v7
        with:
          path: meta
      - name: Check out Arashi CLI
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi
          ref: main
          path: meta/repos/arashi
      - name: Check out Arashi docs
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-docs
          ref: main
          path: meta/repos/arashi-docs
      - name: Check out Arashi skills
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-skills
          ref: main
          path: meta/repos/arashi-skills
      - name: Check out Arashi VS Code
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-vscode
          ref: main
          path: meta/repos/arashi-vscode
      - name: Use matching coordinated child branches when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_HEAD_REF:-}" ]; then
            exit 0
          fi
          for repo in arashi arashi-docs arashi-skills arashi-vscode; do
            if git -C "meta/repos/$repo" ls-remote --exit-code --heads origin "refs/heads/$GITHUB_HEAD_REF" >/dev/null 2>&1; then
              git -C "meta/repos/$repo" fetch --depth=1 origin "refs/heads/$GITHUB_HEAD_REF"
              git -C "meta/repos/$repo" checkout --detach FETCH_HEAD
            fi
          done
      - uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24.18.0
          cache: true
          cache-dependency-path: meta/pnpm-lock.yaml
          package-json-file: meta/package.json
          install: false
      - name: Report revisions
        working-directory: meta
        run: |
          for repo in arashi arashi-docs arashi-skills arashi-vscode; do
            printf '%s: ' "$repo"
            git -C "repos/$repo" rev-parse HEAD
          done
      - name: Install pinned checker toolchain
        working-directory: meta
        run: pnpm install --frozen-lockfile
      - name: Test checker
        working-directory: meta
        run: pnpm test
      - name: Type-check checker
        working-directory: meta
        run: pnpm typecheck
      - name: Generate documentation contract exports
        working-directory: meta/repos/arashi-docs
        run: |
          pnpm install --frozen-lockfile
          pnpm sync:content
      - name: Check focused tab launch-disposition documentation semantics
        working-directory: meta
        run: pnpm --dir repos/arashi-docs validate:tab-launch-docs
      - name: Check focused CLI option documentation semantics
        working-directory: meta
        run: pnpm --dir repos/arashi-docs validate:cli-option-docs
      - name: Check focused packaged-skill tab launch-disposition semantics
        working-directory: meta
        run: node repos/arashi-skills/scripts/tab-launch-disposition-guidance-selftest.mjs
      - name: Check focused packaged-skill CLI option semantics
        working-directory: meta
        run: node repos/arashi-skills/scripts/cli-flag-rationalization-guidance-selftest.mjs
      - name: Check release-shaped packaged-skill CLI option semantics
        working-directory: meta
        run: |
          tar -czf arashi-skill-package.tar.gz -C repos/arashi-skills skills/
          mkdir package-check
          tar -xzf arashi-skill-package.tar.gz -C package-check
          node repos/arashi-skills/scripts/cli-flag-rationalization-guidance-selftest.mjs --skill-root package-check/skills/arashi
      - name: Check cross-repository contracts
        working-directory: meta
        run: pnpm contracts:check
