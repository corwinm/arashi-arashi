name: Cross-repository command contracts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".arashi/hooks/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/cross-repo-command-contracts.yml"
      - "repos/arashi/src/**"
      - "repos/arashi/schema/**"
      - "repos/arashi/contracts/**"
      - "repos/arashi/.github/workflows/**"
      - "repos/arashi-docs/docs/**"
      - "repos/arashi-docs/scripts/**"
      - "repos/arashi-docs/contracts/**"
      - "repos/arashi-docs/.github/workflows/**"
      - "repos/arashi-skills/skills/**"
      - "repos/arashi-skills/scripts/**"
      - "repos/arashi-skills/contracts/**"
      - "repos/arashi-skills/security/**"
      - "repos/arashi-skills/README.md"
      - "repos/arashi-skills/LICENSE"
      - "repos/arashi-skills/.github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out meta-repository
        uses: actions/checkout@v7
        with:
          path: meta
      - name: Check out Arashi CLI
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi
          ref: main
          path: meta/repos/arashi
      - name: Check out Arashi docs
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-docs
          ref: main
          path: meta/repos/arashi-docs
      - name: Check out Arashi skills
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-skills
          ref: main
          path: meta/repos/arashi-skills
      - name: Check out Arashi VS Code
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-vscode
          ref: main
          path: meta/repos/arashi-vscode
      - name: Check out Arashi presentation
        uses: actions/checkout@v7
        with:
          repository: corwinm/arashi-presentation
          ref: main
          path: meta/repos/arashi-presentation
      - name: Use matching coordinated child branches when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_HEAD_REF:-}" ]; then
            exit 0
          fi
          for repo in arashi arashi-docs arashi-skills arashi-vscode arashi-presentation; do
            if git -C "meta/repos/$repo" ls-remote --exit-code --heads origin "refs/heads/$GITHUB_HEAD_REF" >/dev/null 2>&1; then
              git -C "meta/repos/$repo" fetch --depth=1 origin "refs/heads/$GITHUB_HEAD_REF"
              git -C "meta/repos/$repo" checkout --detach FETCH_HEAD
            fi
          done
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@24.18.0
          cache: true
          cache-dependency-path: meta/pnpm-lock.yaml
          package-json-file: meta/package.json
          install: false
      - name: Report revisions
        working-directory: meta
        run: |
          for repo in arashi arashi-docs arashi-skills arashi-vscode arashi-presentation; do
            printf '%s: ' "$repo"
            git -C "repos/$repo" rev-parse HEAD
          done
      - name: Install pinned checker toolchain
        working-directory: meta
        run: pnpm install --frozen-lockfile
      - name: Install CLI generation toolchain
        working-directory: meta
        run: pnpm --dir repos/arashi install --frozen-lockfile
      - name: Generate CLI configuration schema
        working-directory: meta
        run: pnpm --dir repos/arashi schema:publish
      - name: Check CLI configuration schema freshness
        working-directory: meta
        run: pnpm --dir repos/arashi schema:check
      - name: Generate CLI command contract
        working-directory: meta
        run: pnpm --dir repos/arashi contract:generate
      - name: Check CLI command contract freshness
        working-directory: meta
        run: pnpm --dir repos/arashi contract:check
      - name: Generate native shell-completion artifacts
        working-directory: meta
        run: pnpm --dir repos/arashi completion:generate
      - name: Check native shell-completion freshness
        working-directory: meta
        run: pnpm --dir repos/arashi completion:check
      - name: Reject generated CLI contract diffs
        working-directory: meta
        run: git -C repos/arashi diff --exit-code -- schema/config.schema.json contracts/cli-commands.json contracts/executable-distribution.json src/generated/completions.ts
      - name: Install documentation generation toolchain
        working-directory: meta
        run: pnpm --dir repos/arashi-docs install --frozen-lockfile
      - name: Check documentation semantics
        working-directory: meta
        run: pnpm --dir repos/arashi-docs validate:semantic-docs
      - name: Check authored skill guidance
        working-directory: meta
        run: node repos/arashi-skills/scripts/validate-guidance.mjs
      - name: Create canonical skill release archive
        working-directory: meta
        run: node repos/arashi-skills/scripts/create-release-archive.mjs --root repos/arashi-skills --output arashi-skill-package.tar.gz
      - name: Verify canonical skill release archive
        working-directory: meta
        run: node repos/arashi-skills/scripts/create-release-archive.mjs --verify arashi-skill-package.tar.gz
      - name: Extract canonical skill release archive
        working-directory: meta
        run: |
          mkdir package-check
          tar -xzf arashi-skill-package.tar.gz -C package-check
      - name: Check packaged skill guidance
        working-directory: meta
        run: node repos/arashi-skills/scripts/validate-guidance.mjs --skill-root package-check/skills/arashi
      - name: Test checker
        working-directory: meta
        run: pnpm test
      - name: Type-check checker
        working-directory: meta
        run: pnpm typecheck

      - name: Check cross-repository contracts
        working-directory: meta
        run: pnpm contracts:check:ci
